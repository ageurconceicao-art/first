<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Treino"><title>Meu Treino | 60 Min</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color-scheme:dark;background:#0a1020;color:#f3f7fc}*{box-sizing:border-box}body{margin:0;padding-bottom:50px}main{max-width:620px;margin:auto;padding:18px}header{padding:15px 18px;background:#142035;position:sticky;top:0;z-index:5;border-bottom:1px solid #33465b}.top{max-width:620px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#b8ef96;font-weight:800;letter-spacing:.04em}.pill{border:1px solid #3c516a;background:#26374b;color:#fff;border-radius:10px;padding:10px;font-size:14px}button{cursor:pointer;font:inherit}button:active{transform:scale(.98)}h1{font-size:24px;margin:14px 0 8px}h2{font-size:18px;margin:0 0 7px}p{color:#b5c3d4;line-height:1.5}.days{display:flex;overflow-x:auto;gap:8px;padding:12px 0 18px}.day{flex:0 0 auto;border:1px solid #384f68;background:#223247;border-radius:11px;color:#eaf2ff;padding:12px 10px;min-width:67px}.day.active{background:#b6ef93;color:#0a1a0a;font-weight:800;border-color:#b6ef93}.hero{padding:18px;border-radius:16px;background:linear-gradient(110deg,#244634,#1a304d);margin-bottom:20px}.hero p{margin:0;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.meter{height:9px;background:#41534b;border-radius:99px;overflow:hidden;margin-top:9px}.meter div{background:#b6ef93;height:100%;width:0}.card{background:#152439;border:1px solid #30445e;border-radius:16px;padding:15px;margin:10px 0}.card.complete{border-color:#a0c887}.name{font-weight:750}.meta{font-size:13px;color:#b7c5d6;margin-top:5px}.sets{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.sets button{padding:10px 11px;background:#2a3c53;color:white;border:1px solid #405671;border-radius:9px;font-size:13px}.sets button.on{background:#b6ef93;color:#102310;font-weight:800}.action{border:0;border-radius:9px;padding:10px 13px;background:#32475e;color:#fff;font-size:13px}.action.finished{background:#b6ef93;color:#15210b}.demo{margin-top:13px;display:none}.demo.open{display:block}.demo video{width:100%;background:#05070c;border-radius:12px;max-height:290px;margin:8px 0}.demo iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin:8px 0}.instruction{background:#253b51;border-radius:10px;padding:12px;color:#e1e8f0;font-size:14px;line-height:1.5}.demo a{color:#c6f5a9;display:block;margin-top:9px;font-size:14px;overflow-wrap:anywhere}.finish{background:#1d3045;padding:15px;border-radius:14px;margin-top:18px}.hidden{display:none}.fine{font-size:12px;color:#a9b9cb}.history-row{padding:12px;border-bottom:1px solid #34455d}.utility{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}</style></head><body><header><div class="top"><span class="brand">💪 MEU TREINO</span><button id="historyBtn" class="action">Histórico</button></div></header><main><section id="training"><h1>Treino da semana</h1><p>Assista ao movimento, faça a série e marque como concluída.</p><nav id="days" class="days" aria-label="Selecione o dia"></nav><div class="hero"><p id="day"></p><h1 id="title"></h1><div class="row"><small id="counter"></small><strong id="percent"></strong></div><div class="meter"><div id="meter"></div></div></div><h2>Exercícios</h2><div id="exercises"></div><div id="finish" class="finish"></div><div class="utility"><button id="today" class="action">Ir para hoje</button><button id="reset" class="action">Limpar marcações</button></div></section><section id="history" class="hidden"></section><p class="fine">Comece com 5 min de aquecimento e cargas leves. Se voltou recentemente, faça 2 séries por exercício nas primeiras semanas. Vídeos exigem internet. As marcações são salvas neste navegador.</p></main><script>
const DATA=[["Segunda","Peito + tríceps","15 min de caminhada acelerada",[["Supino reto na máquina",3,"10–12","lever-lying-chest-press","Ajuste o banco para que os pegadores fiquem na altura do peito. Empurre devagar, sem travar os cotovelos."],["Supino inclinado com halteres",3,"10–12","dumbbell-incline-bench-press","Incline o banco levemente, mantenha os pés apoiados e desça os halteres com controle."],["Crucifixo no peck deck",2,"12–15","lever-pec-deck-fly","Apoie as costas; feche os braços à frente do peito lentamente."],["Tríceps na corda",3,"12","cable-pushdown-rope-attachment","Cotovelos juntos ao corpo; estenda os braços sem balançar."],["Tríceps unilateral",2,"12","cable-standing-one-arm-triceps-extension","Estenda um braço por vez, com o tronco estável."]]],["Terça","Costas + bíceps + abdômen","5–10 min de caminhada leve",[["Puxada alta",3,"10–12","cable-pulldown","Traga a barra à parte superior do peito, sem jogar o corpo para trás."],["Remada baixa",3,"10–12","cable-one-arm-twisting-seated-row","Puxe o pegador em direção ao abdômen, sem curvar a lombar."],["Remada sentada",2,"12","band-seated-row","Puxe com os cotovelos, mantendo os ombros afastados das orelhas."],["Rosca direta",2,"12","dumbbell-biceps-curl","Dobre os cotovelos sem impulso."],["Rosca martelo",2,"12","dumbbell-cross-body-hammer-curl","Mantenha as palmas voltadas uma para a outra."],["Abdominal na máquina",2,"12–15","lever-seated-crunch-1","Contraia a barriga e evite puxar o pescoço."]]],["Quarta","Pernas + glúteos","10 min de bicicleta leve",[["Leg press 45°",3,"12","sled-45-degree-leg-wide-press","Mantenha o quadril apoiado e alinhe os joelhos com os pés."],["Cadeira extensora",2,"12","lever-leg-extension","Estenda os joelhos de forma controlada."],["Cadeira flexora",3,"12","lever-seated-leg-curl","Flexione os joelhos sem levantar o quadril do banco."],["Cadeira abdutora",2,"15","lever-seated-hip-abduction","Abra as pernas e retorne lentamente."],["Elevação pélvica",3,"12","dumbbell-glute-bridge","Suba o quadril contraindo os glúteos. Demonstração de variação com halter."],["Panturrilha",2,"15","lever-standing-calf-raise","Eleve os calcanhares e desça com controle."]]],["Quinta","Cardio + mobilidade","Cardio em ritmo que permita conversar",[["Caminhada acelerada",1,"20 min","cardio-exercises","Caminhe em ritmo moderado, sem correr."],["Bicicleta ergométrica",1,"20 min","cardio-exercises-machine","Pedale de forma contínua e confortável."],["Mobilidade do quadril",1,"7 min","stretching-hip-circles-stretch","Faça círculos lentos com o quadril."],["Mobilidade dos ombros",1,"7 min","stretching-band-warm-up-shoulder-stretch","Movimente os ombros sem forçar."],["Alongamento leve",1,"6 min","stretching-hamstring-stretch","Alongue suavemente."]]],["Sexta","Peito + costas + ombros","15 min de esteira ou bicicleta",[["Supino inclinado na máquina",3,"10–12","lever-incline-hammer-chest-press","Ajuste o banco e empurre sem travar os cotovelos."],["Puxada alta",3,"10–12","cable-pulldown","Puxe a barra até a parte superior do peito."],["Remada na polia",3,"12","cable-one-arm-twisting-seated-row","Puxe em direção à cintura sem girar demais o tronco."],["Desenvolvimento de ombros",2,"10–12","dumbbell-bench-seated-press","Empurre acima da cabeça, sem arquear excessivamente a lombar."],["Elevação lateral",2,"12–15","dumbbell-lateral-raise","Levante os halteres até perto da altura dos ombros."]]],["Sábado","Pernas + abdômen","10 min de bicicleta ou caminhada",[["Agachamento com halter",3,"10","dumbbell-goblet-squat","Desça até uma amplitude confortável, mantendo os joelhos alinhados aos pés."],["Cadeira flexora",3,"12","lever-seated-leg-curl","Flexione os joelhos sem impulso."],["Cadeira extensora",2,"12","lever-leg-extension","Estenda os joelhos devagar."],["Panturrilha",3,"15","lever-standing-calf-raise","Eleve os calcanhares e desça lentamente."],["Abdominal na máquina",3,"12","lever-seated-crunch-1","Contraia o abdômen sem puxar o pescoço."],["Prancha",2,"20–30 s","front-plank-female","Mantenha quadril e tronco alinhados."]]],["Domingo","Recuperação ativa","Descanso; caminhada opcional",[["Caminhada leve (opcional)",1,"20–40 min","cardio-exercises","Caminhe em ritmo confortável."],["Alongamento leve (opcional)",1,"5–10 min","stretching-hamstring-stretch","Não force amplitude."]]]];
const base='https://pub-585d42eb1aa64a67aedf483ec328d3fe.r2.dev/exercise-videos/';
const $=id=>document.getElementById(id);
const names=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
let selected=names[new Date().getDay()],state={};
try{state=JSON.parse(localStorage.getItem('treino-ageu-v1')||'{}')||{}}catch(e){}
const date=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const key=()=>date()+'|'+selected;
const get=(i,j)=>Boolean(state[key()]?.[i+':'+j]);
const save=()=>{try{localStorage.setItem('treino-ageu-v1',JSON.stringify(state))}catch(e){alert('O Safari bloqueou o salvamento. Abra fora do modo privado.')}};
const gluteBridgeVideo='KjoL5FXJGQE';
const video=x=>base+(['front-plank-female','cardio-exercises-machine'].includes(x)?'female/':'male/')+x+'.mp4';
function set(i,j){state[key()]??={};state[key()][i+':'+j]=!get(i,j);save();render()}
function setAll(i){const ex=DATA.find(x=>x[0]===selected)[3][i];const value=!Array.from({length:ex[1]},(_,j)=>get(i,j)).every(Boolean);state[key()]??={};for(let j=0;j<ex[1];j++)state[key()][i+':'+j]=value;save();render()}
function render(){
const d=DATA.find(x=>x[0]===selected);
$('days').replaceChildren();
for(const x of DATA){let b=document.createElement('button');b.className='day'+(x[0]===selected?' active':'');b.textContent=x[0].slice(0,3);b.onclick=()=>{selected=x[0];render()};$('days').append(b)}
$('day').textContent=d[0];$('title').textContent=d[1];$('finish').textContent='🚶 Finalização: '+d[2];
const total=d[3].reduce((n,e)=>n+e[1],0),done=d[3].reduce((n,e,i)=>n+Array.from({length:e[1]},(_,j)=>get(i,j)).filter(Boolean).length,0);
$('counter').textContent=done+' de '+total+' séries concluídas';$('percent').textContent=Math.round(done/total*100)+'%';$('meter').style.width=(done/total*100)+'%';
$('exercises').replaceChildren();
for(let i=0;i<d[3].length;i++){let e=d[3][i],complete=Array.from({length:e[1]},(_,j)=>get(i,j)).every(Boolean);let card=document.createElement('article');card.className='card'+(complete?' complete':'');
let top=document.createElement('div');top.className='row';let summary=document.createElement('div');let strong=document.createElement('div');strong.className='name';strong.textContent=(i+1)+'. '+e[0];let meta=document.createElement('div');meta.className='meta';meta.textContent=e[1]+' série(s) × '+e[2];summary.append(strong,meta);let all=document.createElement('button');all.className='action'+(complete?' finished':'');all.textContent=complete?'✓ Feito':'Marcar tudo';all.onclick=()=>setAll(i);top.append(summary,all);card.append(top);
let sets=document.createElement('div');sets.className='sets';for(let j=0;j<e[1];j++){let b=document.createElement('button');b.className=get(i,j)?'on':'';b.textContent=(get(i,j)?'✓ ':'')+(e[1]===1?'Concluído':'Série '+(j+1));b.onclick=()=>set(i,j);sets.append(b)}card.append(sets);
let open=document.createElement('button');open.className='action';open.textContent='▶ Vídeo + instruções';let panel=document.createElement('div');panel.className='demo';let instr=document.createElement('p');instr.className='instruction';instr.textContent=e[4];const isGluteBridge=e[3]==='dumbbell-glute-bridge';
const v=document.createElement(isGluteBridge?'iframe':'video');
if(isGluteBridge){
  v.title='Demonstração de elevação pélvica com halter';
  v.allowFullscreen=true;
  v.referrerPolicy='strict-origin-when-cross-origin';
}else{
  v.controls=true;
  v.playsInline=true;
  v.preload='none';
  v.loop=true;
}
let link=document.createElement('a');
link.href=isGluteBridge?'https://www.youtube.com/watch?v='+gluteBridgeVideo:video(e[3]);
link.textContent=isGluteBridge?'Assistir à elevação pélvica no YouTube':'Abrir vídeo diretamente';link.target='_blank';link.rel='noopener';let alt=document.createElement('a');alt.href='https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' demonstração academia');alt.textContent='Buscar outro vídeo no YouTube';alt.target='_blank';alt.rel='noopener';panel.append(instr,v,link,alt);open.onclick=()=>{
  const opened=panel.classList.toggle('open');
  if(isGluteBridge){
    if(opened) v.src='https://www.youtube-nocookie.com/embed/'+gluteBridgeVideo+'?playsinline=1';
    else v.removeAttribute('src');
  }else if(opened){
    v.src=link.href;
    v.load();
  }else{
    v.pause();
  }
};card.append(open,panel);$('exercises').append(card)}
}
$('historyBtn').onclick=()=>{let his=$('history'),train=$('training'),show=his.classList.contains('hidden');his.classList.toggle('hidden',!show);train.classList.toggle('hidden',show);$('historyBtn').textContent=show?'Voltar ao treino':'Histórico';if(show){let rows=Object.entries(state).filter(([k,obj])=>Object.values(obj).some(Boolean)).sort((a,b)=>b[0].localeCompare(a[0]));his.replaceChildren();let h=document.createElement('h1');h.textContent='Histórico';his.append(h);if(!rows.length){let p=document.createElement('p');p.textContent='Você ainda não marcou séries.';his.append(p)}for(const [k,obj] of rows){let p=document.createElement('div');p.className='history-row';p.textContent=k.replace('|',' • ')+' — '+Object.values(obj).filter(Boolean).length+' séries';his.append(p)}}};
$('reset').onclick=()=>{if(confirm('Apagar marcações de '+selected+' de hoje?')){delete state[key()];save();render()}};
$('today').onclick=()=>{selected=names[new Date().getDay()];render()};
render();</script></body></html>
